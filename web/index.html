<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invoice Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f0f2f5; }
    .card { border: none; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.07); }
    .section-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #aaa;
      margin-bottom: 1rem;
    }
    .items-table th { font-size: 0.78rem; color: #888; font-weight: 600; }
    .remove-row { opacity: 0; transition: opacity .15s; }
    tr:hover .remove-row { opacity: 1; }
    .total-display { font-size: 1.05rem; font-weight: 700; color: #1a1a2e; }
    .toast-stack { position: fixed; bottom: 1.2rem; right: 1.2rem; z-index: 9999; }
    .navbar-brand { font-weight: 700; color: #1a1a2e !important; letter-spacing: -0.3px; }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar bg-white shadow-sm mb-4">
  <div class="container" style="max-width:860px;">
    <span class="navbar-brand">Invoice Generator</span>
    <div class="d-flex align-items-center gap-3">
      <span id="seller-display" class="text-danger small">⚠ Set up seller info</span>
      <button class="btn btn-sm btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#settingsModal">
        ⚙ Settings
      </button>
    </div>
  </div>
</nav>

<div class="container pb-5" style="max-width:860px;">

  <!-- Invoice Details -->
  <div class="card p-4 mb-3">
    <div class="d-flex align-items-center justify-content-between mb-3">
      <div class="section-label mb-0" data-i18n="section-details">Invoice Details</div>
      <div class="btn-group btn-group-sm" role="group" aria-label="Template">
        <input type="radio" class="btn-check" name="template" id="tpl-default" autocomplete="off" checked onchange="setTemplate('default')">
        <label class="btn btn-outline-secondary" for="tpl-default">EN</label>
        <input type="radio" class="btn-check" name="template" id="tpl-serbian" autocomplete="off" onchange="setTemplate('serbian')">
        <label class="btn btn-outline-secondary" for="tpl-serbian">SRB</label>
      </div>
    </div>
    <div class="row g-3">
      <div class="col-sm-4">
        <label class="form-label small" data-i18n="field-inv-number">Invoice Number</label>
        <input type="text" class="form-control" id="inv-number" placeholder="2026-001" required>
      </div>
      <div class="col-sm-4">
        <label class="form-label small" data-i18n="field-date">Date</label>
        <input type="date" class="form-control" id="inv-date" required>
      </div>
      <div class="col-sm-4">
        <label class="form-label small" data-i18n="field-due-date">Due Date</label>
        <input type="date" class="form-control" id="due-date" required>
      </div>
      <div class="col-sm-3">
        <label class="form-label small" data-i18n="field-currency">Currency</label>
        <select class="form-select" id="currency">
          <option value="EUR" selected>EUR</option>
          <option value="USD">USD</option>
          <option value="RSD">RSD</option>
        </select>
      </div>
      <div class="col-sm-5">
        <label class="form-label small"><span data-i18n="field-reference">Reference Number</span> <span class="text-muted">(optional)</span></label>
        <input type="text" class="form-control" id="reference" placeholder="e.g. 1/2026">
      </div>
    </div>
  </div>

  <!-- Client -->
  <div class="card p-4 mb-3">
    <div class="d-flex align-items-center justify-content-between mb-3">
      <div class="section-label mb-0" data-i18n="section-client">Client</div>
      <div class="d-flex gap-2 flex-wrap">
        <select class="form-select form-select-sm" id="client-select" style="min-width:160px;" onchange="document.getElementById('btn-load-client').disabled=!this.value">
          <option value="">— saved clients —</option>
        </select>
        <button type="button" class="btn btn-sm btn-outline-secondary" id="btn-load-client" onclick="loadSelectedClient()" disabled>Load</button>
        <button type="button" class="btn btn-sm btn-outline-primary" onclick="saveCurrentClient()">Save</button>
        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="exportClient()" title="Export JSON">↓ JSON</button>
        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="importClient()" title="Import JSON">↑ JSON</button>
      </div>
    </div>
    <div class="row g-3">
      <div class="col-sm-6">
        <label class="form-label small" data-i18n="field-company-name">Company Name</label>
        <input type="text" class="form-control" id="client_name" required>
      </div>
      <div class="col-sm-6">
        <label class="form-label small" data-i18n="field-email">Email</label>
        <input type="email" class="form-control" id="client_email">
      </div>
      <div class="col-sm-6">
        <label class="form-label small" data-i18n="field-street-address">Street Address</label>
        <input type="text" class="form-control" id="client_address">
      </div>
      <div class="col-sm-3">
        <label class="form-label small" data-i18n="field-city">City</label>
        <input type="text" class="form-control" id="client_city">
      </div>
      <div class="col-sm-3">
        <label class="form-label small" data-i18n="field-country">Country</label>
        <input type="text" class="form-control" id="client_country">
      </div>
      <div class="col-sm-4">
        <label class="form-label small" data-i18n="field-reg-number">Reg. Number</label>
        <input type="text" class="form-control" id="client_reg_number">
      </div>
      <div class="col-sm-4">
        <label class="form-label small" data-i18n="field-vat-number">VAT Number</label>
        <input type="text" class="form-control" id="client_vat_number">
      </div>
    </div>
  </div>

  <!-- Line Items -->
  <div class="card p-4 mb-3">
    <div class="section-label" data-i18n="section-items">Line Items</div>
    <table class="table table-sm items-table align-middle mb-2">
      <thead>
        <tr>
          <th id="th-description" data-i18n="th-description">Description</th>
          <th id="th-qty" style="width:9%" data-i18n="th-qty">Qty</th>
          <th id="th-unit" style="width:10%" data-i18n="th-unit">Unit</th>
          <th id="th-rate" style="width:13%" data-i18n="th-rate">Rate</th>
          <th id="th-amount" style="width:12%" class="text-end" data-i18n="th-amount">Amount</th>
          <th style="width:4%"></th>
        </tr>
      </thead>
      <tbody id="items-body"></tbody>
    </table>
    <div class="d-flex justify-content-between align-items-center mt-1">
      <button type="button" class="btn btn-sm btn-outline-secondary" onclick="addItem()" data-i18n="btn-add-line">+ Add line</button>
      <div class="total-display" id="grand-total"></div>
    </div>
  </div>

  <!-- Notes -->
  <div class="card p-4 mb-4">
    <div class="section-label" data-i18n="section-notes">Notes</div>
    <textarea class="form-control" id="notes" rows="2">VAT not applicable – export of services (B2B)</textarea>
  </div>

  <div class="d-grid">
    <button type="button" class="btn btn-dark btn-lg" onclick="generatePDF()" data-i18n="btn-generate">Generate PDF</button>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal fade" id="settingsModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title fw-bold">Seller Settings</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="text-muted small mb-3">Saved locally in your browser. Never sent anywhere.</p>
        <div class="row g-3">
          <div class="col-sm-6">
            <label class="form-label small">Full Name / Company</label>
            <input type="text" class="form-control" id="seller_name">
          </div>
          <div class="col-sm-6">
            <label class="form-label small">Email</label>
            <input type="email" class="form-control" id="seller_email">
          </div>
          <div class="col-sm-6">
            <label class="form-label small">Street Address</label>
            <input type="text" class="form-control" id="seller_address">
          </div>
          <div class="col-sm-3">
            <label class="form-label small">City</label>
            <input type="text" class="form-control" id="seller_city">
          </div>
          <div class="col-sm-3">
            <label class="form-label small">Country</label>
            <input type="text" class="form-control" id="seller_country" placeholder="Serbia">
          </div>
          <div class="col-sm-4">
            <label class="form-label small">PIB</label>
            <input type="text" class="form-control" id="seller_pib">
          </div>
          <div class="col-sm-4">
            <label class="form-label small">Matični broj</label>
            <input type="text" class="form-control" id="seller_maticni_broj">
          </div>
          <div class="col-sm-4">
            <label class="form-label small">Phone</label>
            <input type="text" class="form-control" id="seller_phone">
          </div>
          <div class="col-12"><hr class="my-1"><small class="text-muted">Payment details</small></div>
          <div class="col-sm-6">
            <label class="form-label small">Bank</label>
            <input type="text" class="form-control" id="seller_bank">
          </div>
          <div class="col-sm-6">
            <label class="form-label small">IBAN</label>
            <input type="text" class="form-control" id="seller_iban">
          </div>
          <div class="col-sm-4">
            <label class="form-label small">SWIFT/BIC</label>
            <input type="text" class="form-control" id="seller_swift">
          </div>
        </div>
      </div>
      <div class="modal-footer border-0 pt-0 justify-content-between">
        <div class="d-flex gap-2">
          <button type="button" class="btn btn-sm btn-outline-secondary" onclick="exportSellerSettings()">↓ Export JSON</button>
          <button type="button" class="btn btn-sm btn-outline-secondary" onclick="importSellerSettings()">↑ Import JSON</button>
        </div>
        <div class="d-flex gap-2">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-dark" onclick="saveSellerSettings()">Save</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast-stack" id="toast-stack"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/vfs_fonts.min.js"></script>
<script src="template-default.js"></script>
<script src="template-serbian.js"></script>
<script src="app.js"></script>
</body>
</html>
